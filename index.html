<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>هاب هوش مصنوعی</title>
  <meta name="theme-color" content="#1C1B1F" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>هاب هوش مصنوعی</h1>
    </div>
    <div class="header-actions">
      <button id="weatherBtn" class="icon-btn" aria-label="آب و هوا">☁</button>
      <button id="clearBtn" class="icon-btn" aria-label="گفتگوی جدید">✚</button>
    </div>
  </header>

  <div class="model-bar">
    <span class="pill"><span class="status-dot"></span>Gemini</span>
  </div>

  <main class="chat-area" id="chatArea"></main>

  <footer class="composer">
    <textarea id="userInput" placeholder="پیامت رو بنویس..." rows="1"></textarea>
    <button id="sendBtn" class="send-btn" aria-label="ارسال">↑</button>
  </footer>

  <!-- پنل آب‌وهوا -->
  <div class="sheet-overlay" id="weatherOverlay">
    <div class="sheet">
      <div class="sheet-header">
        <h2>آب و هوا</h2>
        <button id="closeWeather" class="icon-btn" aria-label="بستن">✕</button>
      </div>

      <div class="weather-search-row">
        <input type="text" id="citySearch" placeholder="اسم هر شهری رو بنویس (تهران، پاریس، دبی...)" />
        <button id="citySearchBtn" class="icon-btn" aria-label="جستجو">🔍</button>
      </div>

      <div class="city-chips" id="cityChips">
        <button class="chip" data-city="تهران">تهران</button>
        <button class="chip" data-city="مشهد">مشهد</button>
        <button class="chip" data-city="اصفهان">اصفهان</button>
        <button class="chip" data-city="شیراز">شیراز</button>
        <button class="chip" data-city="تبریز">تبریز</button>
        <button class="chip" data-city="اهواز">اهواز</button>
        <button class="chip" data-city="رشت">رشت</button>
        <button class="chip" data-city="کرمان">کرمان</button>
      </div>

      <div id="weatherResult" class="weather-result"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
